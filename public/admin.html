<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ratings Admin</title><style>body{font-family:Arial;background:#f3f6fa;margin:0;color:#17243a}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 4px 15px #0001}input,button{font:inherit;padding:10px;border-radius:8px}input{border:1px solid #9da9b9}button{border:0;background:#155e9f;color:#fff;font-weight:bold;cursor:pointer}.small{padding:7px 9px;font-size:13px}.muted{color:#667085}.details{display:none}.details.open{display:block}.danger{background:#9f2525}.green{color:#17723d}.red{color:#a22525}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e0e5eb}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal-card{background:#fff;border-radius:14px;padding:18px;width:min(440px,100%);box-shadow:0 10px 35px #0004}.modal-card label{display:block;font-weight:bold;margin-top:10px}.modal-card input[type=text],.modal-card input[type=tel]{width:100%;box-sizing:border-box;margin-top:5px}.modal-actions{display:flex;gap:10px;margin-top:16px}.modal-actions button{flex:1}.secondary{background:#667085}@media(max-width:650px){table{font-size:13px}.hide{display:none}}</style></head><body><main class="wrap"><h1>Player Ratings Admin</h1><div class="card"><input id="pw" type="password" placeholder="Admin password"><button id="login">Load Dashboard</button><p id="err" class="red"></p></div><div id="dash" style="display:none"><div class="card"><h2>Status: <span id="status"></span></h2><button id="toggle"></button> <button id="export">Download Results CSV</button><p>Shared player link: <b id="link"></b></p></div><div class="card"><h2>Players</h2><table><thead><tr><th>Name</th><th>Type</th><th>Completed</th><th>Average</th><th class="hide">Ratings</th><th>Details</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div><div class="card"><h2>All Individual Ratings</h2><p class="muted">Admin-only view showing who rated whom and the score given.</p><button id="showAll">Show All Ratings</button><div id="allWrap" class="details"><table><thead><tr><th>Player Rated</th><th>Rated By</th><th>Score</th></tr></thead><tbody id="allRows"></tbody></table></div></div></div></main><div id="editModal" class="modal"><div class="modal-card"><h2>Edit Player</h2><input id="editId" type="hidden"><label>First Name<input id="editFirst" type="text" maxlength="50"></label><label>Last Name<input id="editLast" type="text" maxlength="50"></label><label>Nickname<input id="editNick" type="text" maxlength="50" placeholder="Optional"></label><label>Phone<input id="editPhone" type="tel" inputmode="tel"></label><label style="display:flex;gap:8px;align-items:center;font-weight:normal"><input id="editGoalie" type="checkbox"> Goalie</label><p id="editErr" class="red"></p><div class="modal-actions"><button id="saveEdit">Save Changes</button><button id="cancelEdit" class="secondary">Cancel</button></div></div></div><script>
let pw='',open=false,allRatings=[],playerMap={};const $=id=>document.getElementById(id);const displayName=p=>`${p.first_name}${p.nickname?` \"${p.nickname}\"`:''} ${p.last_name}`;const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));async function call(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-password':pw};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function load(){try{pw=$('pw').value;allRatings=[];const d=await call('/api/admin/data');open=d.open;$('dash').style.display='block';$('status').textContent=open?'OPEN':'CLOSED';$('status').className=open?'green':'red';$('toggle').textContent=open?'Close Ratings':'Open Ratings';$('toggle').className=open?'danger':'';$('link').textContent=location.origin;const tb=$('rows');tb.innerHTML='';playerMap={};for(const p of d.players){playerMap[p.id]=p;const tr=document.createElement('tr');tr.innerHTML=`<td>${esc(displayName(p))}</td><td>${p.is_goalie?'Goalie':'Skater'}</td><td>${p.completed?'Yes':'No'}</td><td>${p.average??'—'}</td><td class="hide">${p.rating_count}</td><td><button class="small" onclick="viewPlayerRatings(${p.id})">View Ratings</button></td><td><button class="small" onclick="editPlayer(${p.id})">Edit</button> ${p.completed?`<button onclick="resetPlayer(${p.id})">Reset</button> `:''}<button class="danger" onclick="deletePlayer(${p.id})">Delete</button></td>`;tb.appendChild(tr)}}catch(e){$('err').textContent=e.message}}
window.viewPlayerRatings=async id=>{try{if(!allRatings.length)allRatings=await call('/api/admin/ratings');const rows=allRatings.filter(x=>Number(x.rated_id)===Number(id));const name=rows.length?`${rows[0].rated_first_name}${rows[0].rated_nickname?` \"${rows[0].rated_nickname}\"`:''} ${rows[0].rated_last_name}`:'This player';if(!rows.length)return alert(name+' has not received any ratings yet.');alert(name+'\n\n'+rows.map(x=>`${x.rater_first_name}${x.rater_nickname?` \"${x.rater_nickname}\"`:''} ${x.rater_last_name}: ${x.score}`).join('\n'));}catch(e){alert(e.message)}};
$('showAll').onclick=async()=>{try{if(!allRatings.length)allRatings=await call('/api/admin/ratings');const tb=$('allRows');tb.innerHTML='';for(const r of allRatings){const tr=document.createElement('tr');tr.innerHTML=`<td>${esc(`${r.rated_first_name}${r.rated_nickname?` \"${r.rated_nickname}\"`:''} ${r.rated_last_name}`)}${r.rated_is_goalie?' (Goalie)':''}</td><td>${esc(`${r.rater_first_name}${r.rater_nickname?` \"${r.rater_nickname}\"`:''} ${r.rater_last_name}`)}</td><td><b>${r.score}</b></td>`;tb.appendChild(tr)}$('allWrap').classList.toggle('open');$('showAll').textContent=$('allWrap').classList.contains('open')?'Hide All Ratings':'Show All Ratings';}catch(e){alert(e.message)}};
window.editPlayer=id=>{const p=playerMap[id];if(!p)return;$('editId').value=id;$('editFirst').value=p.first_name||'';$('editLast').value=p.last_name||'';$('editNick').value=p.nickname||'';$('editPhone').value=p.phone_normalized||'';$('editGoalie').checked=!!p.is_goalie;$('editErr').textContent='';$('editModal').classList.add('open')};$('cancelEdit').onclick=()=>$('editModal').classList.remove('open');$('saveEdit').onclick=async()=>{try{$('editErr').textContent='';await call('/api/admin/player/'+$('editId').value,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({firstName:$('editFirst').value,lastName:$('editLast').value,nickname:$('editNick').value,phone:$('editPhone').value,isGoalie:$('editGoalie').checked})});$('editModal').classList.remove('open');allRatings=[];load()}catch(e){$('editErr').textContent=e.message}};
$('login').onclick=load;$('toggle').onclick=async()=>{await call('/api/admin/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({open:!open})});load()};window.resetPlayer=async id=>{if(confirm('Allow this player to submit again?')){await call('/api/admin/reset/'+id,{method:'POST'});load()}};window.deletePlayer=async id=>{if(confirm('Delete this player? This will permanently remove all ratings they gave and received.')){try{await call('/api/admin/player/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}};$('export').onclick=async()=>{const r=await fetch('/api/admin/export',{headers:{'x-admin-password':pw}});if(!r.ok)return alert('Export failed');const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='player-ratings.csv';a.click()};
</script></body></html>
