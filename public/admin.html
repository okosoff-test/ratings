<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ratings Admin</title><style>body{font-family:Arial;background:#f3f6fa;margin:0;color:#17243a}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 4px 15px #0001}input,button{font:inherit;padding:10px;border-radius:8px}input{border:1px solid #9da9b9}button{border:0;background:#155e9f;color:#fff;font-weight:bold;cursor:pointer}.small{padding:7px 9px;font-size:13px}.muted{color:#667085}.details{display:none}.details.open{display:block}.danger{background:#9f2525}.green{color:#17723d}.red{color:#a22525}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e0e5eb}@media(max-width:650px){table{font-size:13px}.hide{display:none}}</style></head><body><main class="wrap"><h1>Player Ratings Admin</h1><div class="card"><input id="pw" type="password" placeholder="Admin password"><button id="login">Load Dashboard</button><p id="err" class="red"></p></div><div id="dash" style="display:none"><div class="card"><h2>Status: <span id="status"></span></h2><button id="toggle"></button> <button id="export">Download Results CSV</button><p>Shared player link: <b id="link"></b></p></div><div class="card"><h2>Players</h2><table><thead><tr><th>Name</th><th>Type</th><th>Completed</th><th>Average</th><th class="hide">Ratings</th><th>Details</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div><div class="card"><h2>All Individual Ratings</h2><p class="muted">Admin-only view showing who rated whom and the score given.</p><button id="showAll">Show All Ratings</button><div id="allWrap" class="details"><table><thead><tr><th>Player Rated</th><th>Rated By</th><th>Score</th></tr></thead><tbody id="allRows"></tbody></table></div></div></div></main><script>
let pw='',open=false,allRatings=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));async function call(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-password':pw};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function load(){try{pw=$('pw').value;allRatings=[];const d=await call('/api/admin/data');open=d.open;$('dash').style.display='block';$('status').textContent=open?'OPEN':'CLOSED';$('status').className=open?'green':'red';$('toggle').textContent=open?'Close Ratings':'Open Ratings';$('toggle').className=open?'danger':'';$('link').textContent=location.origin;const tb=$('rows');tb.innerHTML='';for(const p of d.players){const tr=document.createElement('tr');tr.innerHTML=`<td>${esc(p.first_name+' '+p.last_name)}</td><td>${p.is_goalie?'Goalie':'Skater'}</td><td>${p.completed?'Yes':'No'}</td><td>${p.average??'—'}</td><td class="hide">${p.rating_count}</td><td><button class="small" onclick="viewPlayerRatings(${p.id})">View Ratings</button></td><td>${p.completed?`<button onclick="resetPlayer(${p.id})">Reset</button> `:''}<button class="danger" onclick="deletePlayer(${p.id})">Delete</button></td>`;tb.appendChild(tr)}}catch(e){$('err').textContent=e.message}}
window.viewPlayerRatings=async id=>{try{if(!allRatings.length)allRatings=await call('/api/admin/ratings');const rows=allRatings.filter(x=>Number(x.rated_id)===Number(id));const name=rows.length?`${rows[0].rated_first_name} ${rows[0].rated_last_name}`:'This player';if(!rows.length)return alert(name+' has not received any ratings yet.');alert(name+'\n\n'+rows.map(x=>`${x.rater_first_name} ${x.rater_last_name}: ${x.score}`).join('\n'));}catch(e){alert(e.message)}};
$('showAll').onclick=async()=>{try{if(!allRatings.length)allRatings=await call('/api/admin/ratings');const tb=$('allRows');tb.innerHTML='';for(const r of allRatings){const tr=document.createElement('tr');tr.innerHTML=`<td>${esc(r.rated_first_name+' '+r.rated_last_name)}${r.rated_is_goalie?' (Goalie)':''}</td><td>${esc(r.rater_first_name+' '+r.rater_last_name)}</td><td><b>${r.score}</b></td>`;tb.appendChild(tr)}$('allWrap').classList.toggle('open');$('showAll').textContent=$('allWrap').classList.contains('open')?'Hide All Ratings':'Show All Ratings';}catch(e){alert(e.message)}};
$('login').onclick=load;$('toggle').onclick=async()=>{await call('/api/admin/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({open:!open})});load()};window.resetPlayer=async id=>{if(confirm('Allow this player to submit again?')){await call('/api/admin/reset/'+id,{method:'POST'});load()}};window.deletePlayer=async id=>{if(confirm('Delete this player? This will permanently remove all ratings they gave and received.')){try{await call('/api/admin/player/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}};$('export').onclick=async()=>{const r=await fetch('/api/admin/export',{headers:{'x-admin-password':pw}});if(!r.ok)return alert('Export failed');const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='player-ratings.csv';a.click()};
</script></body></html>
